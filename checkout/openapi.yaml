        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/reports:
    post:
      tags: [Reports]
      operationId: createReport
      summary: Create a transaction report
      description: |
        Starts an asynchronous CSV export of financial transactions, payments,
        refunds or disputes for a period. Partners use the `financial_transactions`
        report as the basis for invoicing their share to Kalixo.

        Poll `GET /v1/reports/{id}` until `status` is `ready`, then download it. A `failed`
        report stays failed: create a new one. Reports are deleted 30 days after creation.

        The file is UTF-8 CSV with a header row and RFC 4180 quoting. A text cell that starts
        with `=`, `+`, `-`, `@`, a tab or a carriage return is prefixed with a single quote
        (`'`), so spreadsheet software never runs it as a formula. Numbers, including negative
        amounts, are not prefixed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
            examples:
              financialTransactions: { $ref: "#/components/examples/CreateReport" }
      responses:
        "200":
          description: Report export started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportExport" }
              examples:
                pending: { $ref: "#/components/examples/ReportPending" }
        "400": { $ref: "#/components/responses/ReportBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Reports]
      operationId: listReports
      summary: List report exports
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: A page of report exports.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ReportExport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/reports/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Reports]
      operationId: retrieveReport
      summary: Retrieve a report export
      responses:
        "200":
          description: The report export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportExport" }
              examples:
                ready: { $ref: "#/components/examples/ReportReady" }
