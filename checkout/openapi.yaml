      value: { error: { type: invalid_request_error, code: dispute_already_open, decline_code: null, message: "Payment pay_01M75N56PRT5WA5G2JF25B20RJ already has an open dispute (dp_01M75ND4F9G3H6J9K3M6N1P4QR)", param: null, request_id: req_6f1c2a9e0b7d4c3f8a1e5d2b9c0f4a7e } }
    ErrRateLimited:
      summary: rate_limited
      value: { error: { type: rate_limit_error, code: rate_limited, decline_code: null, message: Too many requests. Slow down and retry with backoff., param: null, request_id: req_6f1c2a9e0b7d4c3f8a1e5d2b9c0f4a7e } }
    ErrTooManyAttempts:
      summary: too_many_attempts
      value: { error: { type: rate_limit_error, code: too_many_attempts, decline_code: null, message: Too many payment attempts for this checkout, param: null, request_id: req_6f1c2a9e0b7d4c3f8a1e5d2b9c0f4a7e } }
    ErrAttemptsRateLimited:
      summary: rate_limited
      value: { error: { type: rate_limit_error, code: rate_limited, decline_code: null, message: Too many payment attempts. Try again in a minute., param: null, request_id: req_6f1c2a9e0b7d4c3f8a1e5d2b9c0f4a7e } }
    ErrInternal:
      summary: internal_error
      value: { error: { type: api_error, code: internal_error, decline_code: null, message: An internal error occurred. Retry with the same Idempotency-Key., param: null, request_id: req_6f1c2a9e0b7d4c3f8a1e5d2b9c0f4a7e } }
    ErrRouteUnavailable:
      summary: payment_route_unavailable
      value: { error: { type: api_error, code: payment_route_unavailable, decline_code: null, message: No payment route is configured for this payment, param: null, request_id: req_6f1c2a9e0b7d4c3f8a1e5d2b9c0f4a7e } }

  schemas:
    Amount:
      type: integer
      format: int64
      minimum: 0
      description: Amount in the currency's minor unit.
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 4217 currency code, uppercase.
      examples: [EUR]
    Country:
      type: string
      pattern: "^[A-Z]{2}$"
      description: ISO 3166-1 alpha-2 country code of the shopper.
      examples: [NL]
    Metadata:
      type: object
      description: Up to 50 keys. Keys up to 40 characters, values up to 500 characters. Echoed back unchanged.
      additionalProperties: { type: string, maxLength: 500 }
      maxProperties: 50
    CaptureMethod:
      type: string
      enum: [automatic, manual]
      description: |
        `automatic` captures the payment as soon as the payment provider confirms the
        authorisation: you receive `payment.authorized`, then `payment.captured`.
        `manual` stops at `authorized` until you call `POST /v1/payments/{id}/capture`.
        When you omit it, Kalixo uses your account's default, which is `automatic`
        unless Kalixo configured `manual` for your account.
    LineItem:
      type: object
      description: |
        Optional itemisation, stored on the session and sent to the payment provider with
        the payment. The sum of `quantity * unit_amount` over all lines must equal the session
        `amount` exactly (`line_items_mismatch` otherwise).
      required: [name, quantity, unit_amount]
      properties:
        type:
          type: string
          enum: [item, shipping, discount]
          default: item
          description: "`discount` lines reduce the total and are the only lines with a negative `unit_amount`."
        name: { type: string, maxLength: 200 }
        quantity: { type: integer, minimum: 1 }
        unit_amount:
          type: integer
          format: int64
          description: |
            Price of one unit in the minor unit, **including tax**. Zero or positive for
            `item` and `shipping`, zero or negative for `discount`.
          examples: [2500, -500]
        tax_amount:
          type: integer
          format: int64
          description: |
            Tax included in one unit's `unit_amount`, in the minor unit. Has the same sign
            as `unit_amount` and is never larger than it in absolute value. Informational:
            Kalixo does not calculate tax.
          examples: [434]
        tax_percentage:
          type: integer
          minimum: 0
          maximum: 10000
          description: Tax rate in basis points (hundredths of a percent). 21% is `2100`, 5.5% is `550`.
          examples: [2100]
        sku: { type: string, maxLength: 100 }
        product_url: { type: string, format: uri }
        image_url: { type: string, format: uri }

    ListEnvelope:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data: { type: array, items: {} }
        has_more: { type: boolean }
        next_cursor: { type: [string, "null"] }

    CheckoutSessionStatus:
      type: string
      enum: [open, complete, expired]
    CheckoutSession:
      type: object
      required: [id, object, status, payment, amount, currency, country, reference, capture_method, return_url, url, expires_at, created_at, livemode, metadata]
      properties:
        id: { type: string, examples: [cs_01JABCDEF] }
        object: { type: string, const: checkout_session }
        status: { $ref: "#/components/schemas/CheckoutSessionStatus" }
        payment: { type: string, description: ID of the payment created with this session. }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { $ref: "#/components/schemas/Currency" }
        country: { $ref: "#/components/schemas/Country" }
        reference: { type: string, description: The partner's order reference. }
        description: { type: [string, "null"] }
        capture_method: { $ref: "#/components/schemas/CaptureMethod" }
        customer: { type: [string, "null"] }
        customer_email: { type: [string, "null"] }
        line_items:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }
        store_payment_method: { type: boolean }
        locale: { type: string, examples: [en-GB] }
        return_url: { type: string, format: uri }
        url:
          type: [string, "null"]
          format: uri
          description: Hosted checkout URL. Contains the client secret in the URL fragment. `null` in list responses and events.
        client_secret: { type: string, description: Pass to Kalixo.js. Do not log or store it in analytics. Omitted in list responses and events. }
        amount_locked: { type: boolean, description: True once the first payment attempt has started. }
        payment_link: { type: [string, "null"] }
        version:
          type: integer
          minimum: 1
          description: Increases with every change. Ignore a `checkout_session.*` event whose session has a lower `version` than the one you stored.
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        livemode: { type: boolean }
        metadata: { $ref: "#/components/schemas/Metadata" }
    CreateCheckoutSessionRequest:
      type: object
      required: [amount, currency, country, reference, return_url]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
        currency: { $ref: "#/components/schemas/Currency" }
        country: { $ref: "#/components/schemas/Country" }
        reference: { type: string, minLength: 1, maxLength: 80 }
        return_url:
          type: string
          format: uri
          description: "HTTPS URL on a domain registered for your account (`return_url_not_allowed` otherwise). The shopper returns here with `?session_id=cs_...`."
        description: { type: string, maxLength: 500 }
        capture_method: { $ref: "#/components/schemas/CaptureMethod" }
        customer: { type: string, description: "Existing customer ID. Required to store payment methods." }
        customer_email: { type: string, format: email }
        line_items:
          type: array
          maxItems: 100
          description: Optional. When present, the lines must add up to `amount` exactly.
          items: { $ref: "#/components/schemas/LineItem" }
        store_payment_method:
          type: boolean
          description: Offer the shopper to save their card for one-click checkout. Requires `customer`.
        locale: { type: string, examples: [nl-NL] }
        expires_in:
          type: integer
          minimum: 900
          maximum: 86400
          default: 3600
          description: Seconds until the session expires.
        metadata: { $ref: "#/components/schemas/Metadata" }
    UpdateCheckoutSessionRequest:
      type: object
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { $ref: "#/components/schemas/Currency" }
        line_items:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }
        description: { type: string, maxLength: 500 }
        metadata: { $ref: "#/components/schemas/Metadata" }

    PaymentStatus:
      type: string
      enum: [requires_payment_method, processing, requires_action, authorized, partially_captured, captured, partially_refunded, refunded, canceled, expired, disputed, charged_back]
    PaymentMethodDetails:
      type: object
      properties:
        type: { type: string, examples: [card, ideal, applepay, googlepay] }
        brand: { type: [string, "null"], examples: [visa] }
        last4: { type: [string, "null"] }
        exp_month: { type: [integer, "null"] }
        exp_year: { type: [integer, "null"] }
        stored_payment_method: { type: [string, "null"], description: "`pm_...` if this payment used or saved a stored method." }
    PaymentError:
      type: object
      properties:
        code: { type: string, examples: [payment_declined] }
        decline_code: { type: [string, "null"], examples: [insufficient_funds] }
        message: { type: string }
    Payment:
      type: object
      required: [id, object, status, amount, currency, amount_authorized, amount_captured, amount_refunded, amount_disputed, amount_capturable, capture_method, reference, metadata, version, created_at, livemode]
      properties:
        id: { type: string, examples: [pay_01JABCDEF] }
        object: { type: string, const: payment }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { $ref: "#/components/schemas/Currency" }
        amount_authorized: { $ref: "#/components/schemas/Amount" }
        amount_captured: { $ref: "#/components/schemas/Amount" }
        amount_refunded: { $ref: "#/components/schemas/Amount" }
        amount_disputed: { $ref: "#/components/schemas/Amount" }
        amount_capturable: { $ref: "#/components/schemas/Amount" }
        amount_mismatch: { type: boolean, description: True if the provider reported an amount different from the expected one. }
        capture_method: { $ref: "#/components/schemas/CaptureMethod" }
        checkout_session: { type: string }
        customer: { type: [string, "null"] }
        reference: { type: string }
        description: { type: [string, "null"] }
        payment_method:
          description: How the shopper paid. `null` until an attempt is authorised.
          oneOf:
            - $ref: "#/components/schemas/PaymentMethodDetails"
            - type: "null"
        last_payment_error:
          oneOf:
            - $ref: "#/components/schemas/PaymentError"
            - type: "null"
        metadata: { $ref: "#/components/schemas/Metadata" }
        version: { type: integer, description: Increases with every change. }
        authorized_at: { type: [string, "null"], format: date-time }
        captured_at: { type: [string, "null"], format: date-time }
        canceled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        livemode: { type: boolean }

    Capture:
      type: object
      required: [id, object, payment, amount, currency, status, created_at]
      properties:
        id: { type: string, examples: [cap_01JABCDEF] }
        object: { type: string, const: capture }
        payment: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { $ref: "#/components/schemas/Currency" }
        status: { type: string, enum: [pending, succeeded, failed] }
        failure_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Cancellation:
      type: object
      required: [id, object, payment, status, created_at]
      properties:
        id: { type: string, examples: [cnl_01JABCDEF] }
        object: { type: string, const: cancellation }
        payment: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        failure_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    Refund:
      type: object
      required: [id, object, payment, amount, currency, status, reason, metadata, created_at]
      properties:
        id: { type: string, examples: [re_01JABCDEF] }
        object: { type: string, const: refund }
        payment: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { $ref: "#/components/schemas/Currency" }
        status: { type: string, enum: [pending, succeeded, failed] }
        reason: { type: string, enum: [requested_by_customer, duplicate, fraudulent, amount_mismatch, other] }
        failure_reason: { type: [string, "null"] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateRefundRequest:
      type: object
      required: [payment]
      properties:
        payment: { type: string }
        amount: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, enum: [requested_by_customer, duplicate, fraudulent, other], default: requested_by_customer }
        metadata: { $ref: "#/components/schemas/Metadata" }

    PaymentLink:
      type: object
      required: [id, object, url, status, amount, currency, country, reference, reusable, capture_method, created_at, metadata]
      properties:
        id: { type: string, examples: [plink_01JABCDEF] }
        object: { type: string, const: payment_link }
        url: { type: string, format: uri }
        status: { type: string, enum: [active, inactive, completed, expired] }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { $ref: "#/components/schemas/Currency" }
        country: { $ref: "#/components/schemas/Country" }
        reference: { type: string }
        description: { type: [string, "null"] }
        reusable: { type: boolean, description: If true the link can be paid more than once. }
        capture_method: { $ref: "#/components/schemas/CaptureMethod" }
        return_url: { type: [string, "null"], format: uri }
        expires_at: { type: [string, "null"], format: date-time }
        payments_count: { type: integer }
        metadata: { $ref: "#/components/schemas/Metadata" }
        created_at: { type: string, format: date-time }
    CreatePaymentLinkRequest:
      type: object
      required: [amount, currency, country, reference]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { $ref: "#/components/schemas/Currency" }
        country: { $ref: "#/components/schemas/Country" }
        reference: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        reusable: { type: boolean, default: false }
        capture_method: { $ref: "#/components/schemas/CaptureMethod" }
        return_url: { type: string, format: uri, description: "HTTPS URL on a domain registered for your account. Without it, the shopper sees a Kalixo confirmation page." }
        expires_at: { type: string, format: date-time, description: At most 90 days in the future. Defaults to 7 days after creation. }
        locale: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }

    Customer:
      type: object
      required: [id, object, created_at, metadata]
      properties:
        id: { type: string, examples: [cus_01JABCDEF] }
        object: { type: string, const: customer }
        reference: { type: [string, "null"], description: The partner's own customer ID. }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        created_at: { type: string, format: date-time }
    CreateCustomerRequest:
      type: object
      properties:
        reference: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        name: { type: string, maxLength: 200 }
        metadata: { $ref: "#/components/schemas/Metadata" }

    PaymentMethod:
      type: object
      required: [id, object, customer, type, status, available, created_at]
      properties:
        id: { type: string, examples: [pm_01JABCDEF] }
        object: { type: string, const: payment_method }
        customer: { type: string }
        type: { type: string, examples: [card] }
        card:
          type: [object, "null"]
          properties:
            brand: { type: string }
            last4: { type: string }
            exp_month: { type: integer }
            exp_year: { type: integer }
        status: { type: string, enum: [active, detached] }
        available:
          type: boolean
          description: False when the partner is routed to a provider that cannot use this stored method.
        created_at: { type: string, format: date-time }

    DisputeStatus:
      type: string
      enum: [needs_response, under_review, funds_withdrawn, won, lost, accepted]
    Dispute:
      type: object
      required: [id, object, payment, status, amount, currency, created_at]
      properties:
        id: { type: string, examples: [dp_01JABCDEF] }
        object: { type: string, const: dispute }
        payment: { type: string }
        status: { $ref: "#/components/schemas/DisputeStatus" }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { $ref: "#/components/schemas/Currency" }
        reason_code: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        evidence_due_by: { type: [string, "null"], format: date-time }
        evidence:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              document_type: { type: string }
              file_name: { type: string }
              created_at: { type: string, format: date-time }
        version: { type: integer, description: Increases with every change. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UploadDisputeEvidenceRequest:
      type: object
      required: [document_type, file_name, content_type, content_base64]
      properties:
        document_type:
          type: string
          examples: [proof_of_delivery, customer_communication, invoice, terms_and_conditions, other]
        file_name: { type: string, maxLength: 200 }
        content_type: { type: string, enum: [application/pdf, image/jpeg, image/tiff] }
        content_base64: { type: string }
        description: { type: string, maxLength: 1000 }

    EventType:
      type: string
      enum:
        - checkout_session.completed
        - checkout_session.expired
        - payment.authorized
        - payment.captured
        - payment.partially_captured
        - payment.failed
        - payment.canceled
        - payment.expired
        - payment.amount_updated
        - payment.amount_mismatch
        - payment.fraud_reported
        - capture.failed
        - refund.succeeded
        - refund.failed
        - dispute.created
        - dispute.updated
        - dispute.funds_withdrawn
        - dispute.won
        - dispute.lost
        - payment_method.attached
        - payment_method.updated
        - payment_method.detached
    Event:
      type: object
      required: [id, type, api_version, created_at, livemode, partner_id, data]
      properties:
        id: { type: string, examples: [evt_01JABCDEF] }
        type: { $ref: "#/components/schemas/EventType" }
        api_version: { type: string, examples: ["2026-10-01"] }
        created_at: { type: string, format: date-time }
        livemode: { type: boolean }
        partner_id: { type: string }
        data:
          type: object
          required: [object]
          properties:
            object:
              description: Full snapshot of the object after the change.
              oneOf:
                - $ref: "#/components/schemas/Payment"
                - $ref: "#/components/schemas/CheckoutSession"
                - $ref: "#/components/schemas/Refund"
                - $ref: "#/components/schemas/Capture"
                - $ref: "#/components/schemas/Dispute"
                - $ref: "#/components/schemas/PaymentMethod"
            related:
              type: object
              description: Related objects, for example the payment of a refund event.
              additionalProperties: true

    WebhookEndpoint:
      type: object
      required: [id, object, url, enabled_events, status, created_at]
      properties:
        id: { type: string, examples: [we_01JABCDEF] }
        object: { type: string, const: webhook_endpoint }
        url: { type: string, format: uri }
        description: { type: [string, "null"] }
        enabled_events:
          type: array
          items: { type: string }
          description: Event types, or `["*"]` for all.
        status: { type: string, enum: [enabled, disabled, deleted], description: "`deleted` only in the response to `DELETE`." }
        secret: { type: string, description: Only returned on create and rotate. Starts with `whsec_`. }
        created_at: { type: string, format: date-time }
    CreateWebhookEndpointRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: "A public HTTPS URL, in the sandbox too. Private and local addresses are refused; use a tunnel to test locally. At most 16 endpoints per account." }
        description: { type: string, maxLength: 200 }
        enabled_events:
          type: array
          items: { type: string }
          default: ["*"]
    UpdateWebhookEndpointRequest:
      type: object
      properties:
        url: { type: string, format: uri }
        description: { type: string, maxLength: 200 }
        enabled_events:
          type: array
          items: { type: string }
        status: { type: string, enum: [enabled, disabled] }

    ReportExport:
      type: object
      required: [id, object, type, period_start, period_end, status, created_at]
      properties:
        id: { type: string, examples: [rex_01JABCDEF] }
        object: { type: string, const: report_export }
        type: { type: string, enum: [financial_transactions, payments, refunds, disputes] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        status: { type: string, enum: [pending, ready, failed] }
        row_count: { type: [integer, "null"] }
        failure_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    CreateReportRequest:
      type: object
      required: [type, period_start, period_end]
      properties:
        type: { type: string, enum: [financial_transactions, payments, refunds, disputes] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time, description: Exclusive. At most 92 days after `period_start`. }

    WebhookTestDelivery:
      type: object
      required: [object, webhook_endpoint, event, delivered, status_code, error, duration_ms]
      properties:
        object: { type: string, const: webhook_test_delivery }
        webhook_endpoint: { type: string, examples: [we_01JABCDEF] }
        event: { $ref: "#/components/schemas/Event" }
        delivered: { type: boolean, description: True if your endpoint answered with a `2xx`. }
        status_code: { type: [integer, "null"], description: HTTP status your endpoint returned. `null` if it could not be reached. }
        error: { type: [string, "null"], description: "Why the delivery failed, for example `HTTP 500` or a timeout." }
        duration_ms: { type: integer }
    DisputeSimulation:
      type: object
      required: [object, payment, dispute, stage, status]
      properties:
        object: { type: string, const: dispute_simulation }
        payment: { type: string }
        dispute: { type: [string, "null"], description: The open dispute the stage applies to. `null` when a new dispute will be opened. }
        stage: { type: string, enum: [opened, funds_withdrawn, won, lost] }
        status: { type: string, const: pending, description: The dispute changes asynchronously; watch for `dispute.*` events. }
    CheckoutSessionSimulation:
      type: object
      required: [object, checkout_session, payment, outcome, attempt]
      properties:
        object: { type: string, const: checkout_session_simulation }
        checkout_session: { type: string }
        payment: { type: string }
        outcome: { type: string, enum: [succeeded, declined, insufficient_funds, processing, amount_mismatch] }
        attempt:
          type: object
          required: [id, status, error]
          description: The simulated attempt's immediate result. The payment's final state arrives by webhook.
          properties:
            id: { type: string }
            status: { type: string, enum: [authorized, processing, requires_action, refused, error] }
            error:
              oneOf:
                - $ref: "#/components/schemas/PaymentError"
                - type: "null"

    ClientCheckoutSession:
      type: object
      required: [id, status, amount, currency, country, locale, renderer, payment_status]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/CheckoutSessionStatus" }
        payment_status: { $ref: "#/components/schemas/PaymentStatus" }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { $ref: "#/components/schemas/Currency" }
        country: { $ref: "#/components/schemas/Country" }
        locale: { type: string }
        description: { type: [string, "null"] }
        partner_name: { type: string }
        store_payment_method: { type: boolean }
        return_url: { type: string, format: uri }
        terms_url: { type: string, format: uri }
        theme:
          type: object
          additionalProperties: true
        renderer:
          type: object
          required: [type, config]
          properties:
            type: { type: string, description: "Identifies the payment form Kalixo.js loads. Opaque; do not rely on specific values." }
            version: { type: string }
            config:
              type: object
              additionalProperties: true
              description: Opaque, renderer-specific configuration.
    ClientCreateAttemptRequest:
      type: object
      required: [payment_method_data]
      properties:
        payment_method_data:
          type: object
          additionalProperties: true
          description: Opaque renderer payload (encrypted card fields, browser info, risk data, SDK data). Amount fields are ignored.
        store_payment_method: { type: boolean }
        origin: { type: string, format: uri }
    ClientAttemptResult:
      type: object
      required: [attempt_id, status]
      properties:
        attempt_id: { type: string }
        status: { type: string, enum: [authorized, processing, requires_action, refused, error] }
        error:
          oneOf:
            - $ref: "#/components/schemas/PaymentError"
            - type: "null"
        provider_payload:
          type: object
          additionalProperties: true
          description: Opaque data for Kalixo.js only. Partners must not rely on it.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum: [invalid_request_error, authentication_error, permission_error, not_found_error, idempotency_error, payment_error, rate_limit_error, api_error]
            code: { type: string, examples: [amount_locked], description: "Stable machine-readable code. Branch on `code`, not on `message`." }
            decline_code: { type: [string, "null"], description: Set on declined payments only. }
            message: { type: string, description: Human-readable explanation. Can change; do not parse it. }
            param: { type: [string, "null"], description: "The request field or header that caused the error, when there is one." }
            request_id: { type: string, description: Same as the `Request-Id` response header. Include it when you contact support. }
