openapi: 3.1.0
info:
  title: Kalixo Checkout API
  version: "2026-10-01"
  summary: Payment orchestration API for Kalixo partners.
  description: |
    Kalixo Checkout lets partners collect payments from their shoppers through one
    provider-neutral API. Kalixo is merchant of record and handles payment
    processing, so partners never integrate a payment provider directly.

    - Amounts are integers in the currency's minor unit (EUR 49.99 = `4999`).
    - Server endpoints use a secret key (`kc_sk_test_...` or `kc_sk_live_...`).
    - Client endpoints are called by `Kalixo.js` with a publishable key and the
      checkout session's `client_secret`.
    - Every `POST` with a secret key requires an `Idempotency-Key` header.
    - Every response has a `Request-Id` header. Errors repeat it in `error.request_id`;
      include it when you contact Kalixo support.
    - Bursts above about 50 requests per second per API key can be rejected with
      `429 rate_limit_error`. Retry with exponential backoff.
    - Request bodies with unknown fields are rejected (`parameter_invalid`). Responses
      and events can gain fields at any time; ignore the ones you do not know.
  contact:
    name: Kalixo Checkout integrations
    email: integrations@kalixo.io
  license:
    name: Proprietary
    url: https://kalixo.io/legal
servers:
  - url: https://checkout.kalixo.io
    description: Live
  - url: https://test-checkout.kalixo.io
    description: Sandbox (test keys only, never moves money)
security:
  - secretKey: []
tags:
  - name: Checkout sessions
    description: Create a session with the amount to charge, then show it with Kalixo.js or the hosted checkout.
  - name: Payments
    description: Read payments and capture or cancel authorized payments.
  - name: Refunds
    description: Full and partial refunds of captured payments.
  - name: Payment links
    description: Kalixo-hosted payment links that survive provider switches.
  - name: Customers
    description: Customers and their stored payment methods for one-click checkout.
  - name: Disputes
    description: Chargebacks and information requests, plus evidence upload.
  - name: Events
    description: The event log behind webhooks.
  - name: Webhook endpoints
    description: Where Kalixo delivers signed events.
  - name: Reports
    description: CSV exports of transactions for reconciliation and partner invoicing.
  - name: Test helpers
    description: Sandbox only. Send test webhook events and simulate disputes.
  - name: Client
    description: Called by Kalixo.js and the hosted checkout. Not for partner servers.

paths:
  /v1/checkout-sessions:
    post:
      tags: [Checkout sessions]
      operationId: createCheckoutSession
      summary: Create a checkout session
      description: |
        Creates a checkout session and its payment. The amount and currency set
        here are the only amount Kalixo will ever charge for this session.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckoutSessionRequest" }
            examples:
              minimal: { $ref: "#/components/examples/CreateSessionMinimal" }
              lineItems: { $ref: "#/components/examples/CreateSessionWithLineItems" }
              manualCapture: { $ref: "#/components/examples/CreateSessionManualCapture" }
      responses:
        "200":
          description: Checkout session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
              examples:
                session: { $ref: "#/components/examples/CheckoutSessionOpen" }
        "400": { $ref: "#/components/responses/CreateSessionBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/AmountLimitExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Checkout sessions]
      operationId: listCheckoutSessions
      summary: List checkout sessions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CheckoutSessionStatus" }
        - name: reference
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of checkout sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/CheckoutSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/checkout-sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Checkout sessions]
      operationId: retrieveCheckoutSession
      summary: Retrieve a checkout session
      responses:
        "200":
          description: The checkout session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
              examples:
                session: { $ref: "#/components/examples/CheckoutSessionOpen" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Checkout sessions]
      operationId: updateCheckoutSession
      summary: Update a checkout session
      description: |
        `amount`, `currency` and `line_items` can only change before the first
        payment attempt. After that the amount is locked and the request fails
        with `amount_locked`. `description` and `metadata` can always change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCheckoutSessionRequest" }
            examples:
              amount: { $ref: "#/components/examples/UpdateSessionAmount" }
      responses:
        "200":
          description: The updated checkout session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
              examples:
                session: { $ref: "#/components/examples/CheckoutSessionOpen" }
        "400": { $ref: "#/components/responses/UpdateSessionBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UpdateSessionConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/checkout-sessions/{id}/expire:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Checkout sessions]
      operationId: expireCheckoutSession
      summary: Expire a checkout session
      description: Fails with `payment_in_progress` if an attempt is still being processed, and with `session_not_open` if the session is already complete or expired.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The expired checkout session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
              examples:
                expired: { $ref: "#/components/examples/CheckoutSessionExpired" }
        "400": { $ref: "#/components/responses/PostBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ExpireSessionConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List payments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
        - name: reference
          in: query
          schema: { type: string }
        - name: created_gte
          in: query
          schema: { type: string, format: date-time }
        - name: created_lt
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/payments/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Payments]
      operationId: retrievePayment
      summary: Retrieve a payment
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
              examples:
                captured: { $ref: "#/components/examples/PaymentCaptured" }
                authorized: { $ref: "#/components/examples/PaymentAuthorized" }
                declined: { $ref: "#/components/examples/PaymentDeclined" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/payments/{id}/capture:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Payments]
      operationId: capturePayment
      summary: Capture an authorized payment
      description: |
        Captures a payment created with `capture_method: manual`. Payments with
        `capture_method: automatic` are captured by Kalixo and fail here with
        `capture_not_allowed`. Omit `amount`
        to capture the full remaining authorized amount. Partial captures are
        allowed where the payment method supports them. Captures are
        asynchronous: the result arrives as `payment.captured`,
        `payment.partially_captured` or `capture.failed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Amount to capture. Cannot exceed the capturable amount.
            examples:
              full: { $ref: "#/components/examples/CaptureFull" }
              partial: { $ref: "#/components/examples/CapturePartial" }
      responses:
        "200":
          description: Capture requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
              examples:
                pending: { $ref: "#/components/examples/CapturePending" }
        "400": { $ref: "#/components/responses/CaptureBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CaptureConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/payments/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Payments]
      operationId: cancelPayment
      summary: Cancel an authorized payment
      description: |
        Cancels an authorized, not yet captured payment. The result arrives as
        `payment.canceled`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancellation requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cancellation" }
              examples:
                pending: { $ref: "#/components/examples/CancellationPending" }
        "400": { $ref: "#/components/responses/PostBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CancelConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Refund a captured payment
      description: |
        Omit `amount` for a full refund of the remaining captured amount.
        Multiple partial refunds are allowed. The total refunded can never
        exceed the captured amount. The result arrives as `refund.succeeded` or
        `refund.failed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRefundRequest" }
            examples:
              partial: { $ref: "#/components/examples/CreateRefundPartial" }
              full: { $ref: "#/components/examples/CreateRefundFull" }
      responses:
        "200":
          description: Refund requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
              examples:
                pending: { $ref: "#/components/examples/RefundPending" }
        "400": { $ref: "#/components/responses/RefundBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RefundConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List refunds
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: payment
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of refunds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Refund" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/refunds/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Refunds]
      operationId: retrieveRefund
      summary: Retrieve a refund
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
              examples:
                succeeded: { $ref: "#/components/examples/RefundSucceeded" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/payment-links:
    post:
      tags: [Payment links]
      operationId: createPaymentLink
      summary: Create a payment link
      description: |
        Creates a Kalixo payment link (`https://checkout.kalixo.io/l/:code`). Links
        are independent of the payment provider and keep working after a
        provider switch.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentLinkRequest" }
            examples:
              singleUse: { $ref: "#/components/examples/CreatePaymentLink" }
      responses:
        "200":
          description: Payment link created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
              examples:
                link: { $ref: "#/components/examples/PaymentLink" }
        "400": { $ref: "#/components/responses/PaymentLinkBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Payment links]
      operationId: listPaymentLinks
      summary: List payment links
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: A page of payment links.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PaymentLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/payment-links/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Payment links]
      operationId: retrievePaymentLink
      summary: Retrieve a payment link
      responses:
        "200":
          description: The payment link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
              examples:
                link: { $ref: "#/components/examples/PaymentLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/payment-links/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Payment links]
      operationId: deactivatePaymentLink
      summary: Deactivate a payment link
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The deactivated payment link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
              examples:
                inactive: { $ref: "#/components/examples/PaymentLinkInactive" }
        "400": { $ref: "#/components/responses/PostBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: Customers are needed to store payment methods for one-click checkout.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
            examples:
              customer: { $ref: "#/components/examples/CreateCustomer" }
      responses:
        "200":
          description: Customer created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              examples:
                customer: { $ref: "#/components/examples/Customer" }
        "400": { $ref: "#/components/responses/PostBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: reference
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of customers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Customers]
      operationId: retrieveCustomer
      summary: Retrieve a customer
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              examples:
                customer: { $ref: "#/components/examples/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/customers/{id}/payment-methods:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Customers]
      operationId: listCustomerPaymentMethods
      summary: List a customer's stored payment methods
      responses:
        "200":
          description: The customer's stored payment methods.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PaymentMethod" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/customers/{id}/payment-methods/{payment_method_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: payment_method_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Customers]
      operationId: detachCustomerPaymentMethod
      summary: Detach a stored payment method
      description: Deletes the token at the provider and marks the payment method `detached`.
      responses:
        "200":
          description: The detached payment method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
              examples:
                detached: { $ref: "#/components/examples/PaymentMethodDetached" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/disputes:
    get:
      tags: [Disputes]
      operationId: listDisputes
      summary: List disputes
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DisputeStatus" }
      responses:
        "200":
          description: A page of disputes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/disputes/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Disputes]
      operationId: retrieveDispute
      summary: Retrieve a dispute
      responses:
        "200":
          description: The dispute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
              examples:
                needsResponse: { $ref: "#/components/examples/DisputeNeedsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/disputes/{id}/evidence:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Disputes]
      operationId: uploadDisputeEvidence
      summary: Upload dispute evidence
      description: |
        Uploads one evidence document. Kalixo ops review the evidence and decide
        whether to defend the dispute. Allowed types: `application/pdf` (max 2 MB),
        `image/jpeg` and `image/tiff` (max 10 MB). Documents must not contain card
        numbers or identity documents.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadDisputeEvidenceRequest" }
            examples:
              proofOfDelivery: { $ref: "#/components/examples/UploadEvidence" }
      responses:
        "200":
          description: The dispute with the new evidence document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
              examples:
                withEvidence: { $ref: "#/components/examples/DisputeWithEvidence" }
        "400": { $ref: "#/components/responses/EvidenceBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EvidenceConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/events:
