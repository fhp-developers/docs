        "402": { $ref: "#/components/responses/AmountLimitExceeded" }
        "403": { $ref: "#/components/responses/ClientForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ClientConflict" }
        "429": { $ref: "#/components/responses/ClientTooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/RouteUnavailable" }

  /v1/client/attempts/{id}/details:
