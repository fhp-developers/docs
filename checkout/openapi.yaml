        "403": { $ref: "#/components/responses/ClientForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/test-helpers/webhook-endpoints/{id}/send-event:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Test helpers]
      operationId: sendTestWebhookEvent
      summary: Send a test event to a webhook endpoint
      description: |
        Sandbox only. Signs a sample event of `type` with the endpoint's secret
        and sends it to the endpoint once, synchronously. The response tells you
        whether your endpoint answered with a `2xx`.

        Test events are not stored in `GET /v1/events`, are not retried and go
        only to this endpoint, even if it does not subscribe to `type` or is
        disabled. Their objects do not exist: `reference` is `kalixo_test_event`
        and `metadata.kalixo_test_event` is `"true"` where the object has them.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  allOf:
                    - $ref: "#/components/schemas/EventType"
                  default: payment.captured
            examples:
              paymentCaptured: { $ref: "#/components/examples/SendTestEvent" }
      responses:
        "200":
          description: The delivery result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookTestDelivery" }
              examples:
                delivered: { $ref: "#/components/examples/TestDelivery" }
        "400": { $ref: "#/components/responses/TestHelperBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/test-helpers/payments/{id}/dispute:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Test helpers]
      operationId: simulateDispute
      summary: Simulate a dispute on a sandbox payment
      description: |
        Sandbox only. Moves a dispute on a captured payment to `stage`, the way a
        real chargeback does. The dispute and its events (`dispute.created`,
        `dispute.funds_withdrawn`, `dispute.won`, `dispute.lost`) follow
        asynchronously, usually within seconds.

        | `stage` | Dispute status | Events |
        | --- | --- | --- |
        | `opened` | `needs_response` | `dispute.created` |
        | `funds_withdrawn` | `funds_withdrawn` | `dispute.funds_withdrawn` |
        | `won` | `won` | `dispute.won` |
        | `lost` | `lost` | `dispute.lost` |

        Later stages apply to the payment's open dispute, or open a new one.
        Works for payments made with the sandbox test cards only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  enum: [opened, funds_withdrawn, won, lost]
                  default: opened
            examples:
              opened: { $ref: "#/components/examples/SimulateDisputeOpened" }
              lost: { $ref: "#/components/examples/SimulateDisputeLost" }
      responses:
        "200":
          description: The simulation was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeSimulation" }
              examples:
                queued: { $ref: "#/components/examples/DisputeSimulation" }
        "400": { $ref: "#/components/responses/TestHelperBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DisputeSimulationConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/test-helpers/checkout-sessions/{id}/simulate:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Test helpers]
      operationId: simulateCheckoutSession
      summary: Simulate a payment on a sandbox checkout session
      description: |
        Sandbox only. Pays an open checkout session without a shopper, so you can test your
        order flow and webhook handling end to end without a browser or 3D Secure.

        The payment goes through Kalixo's sandbox test processor, never a real payment provider.
        Everything after that is the normal flow: `payment.authorized`, then `payment.captured`
        once the capture is confirmed (or `payment.failed`), and `checkout_session.completed`.
        You can refund the payment and simulate a dispute on it with
        `POST /v1/test-helpers/payments/{id}/dispute`.

        | `outcome` | Result |
        | --- | --- |
        | `succeeded` | Authorised and, with automatic capture, captured |
        | `declined` | Declined; the session stays open, so you can simulate again |
        | `insufficient_funds` | Declined with `decline_code: insufficient_funds` |
        | `processing` | Pending; the outcome arrives by webhook |
        | `amount_mismatch` | Reported with a different amount; Kalixo reverses it and sends `payment.amount_mismatch` |

        Use a session the shopper has not paid on yet: a session with an attempt at a payment
        provider returns `session_has_attempts`. `test_helper_unavailable` means the sandbox
        test processor is not set up in this environment: ask Kalixo integrations.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [succeeded, declined, insufficient_funds, processing, amount_mismatch]
                  default: succeeded
            examples:
              succeeded: { $ref: "#/components/examples/SimulateSessionSucceeded" }
              declined: { $ref: "#/components/examples/SimulateSessionDeclined" }
      responses:
        "200":
          description: The simulated attempt and its immediate result. Webhooks follow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSessionSimulation" }
              examples:
                succeeded: { $ref: "#/components/examples/CheckoutSessionSimulation" }
        "400": { $ref: "#/components/responses/TestHelperBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SessionSimulationConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

webhooks:
  event:
    post:
      operationId: receiveEvent
      summary: Kalixo event delivery
      description: |
        Kalixo POSTs an `Event` to every enabled webhook endpoint subscribed to its
        type. Verify the `Kalixo-Signature` header, answer with any 2xx within
        10 seconds, then process asynchronously. Deliveries are retried with
        exponential backoff for about 3 days. Deduplicate on `id`; ignore events
        whose `data.object.version` is lower than what you already have.
      parameters:
        - name: Kalixo-Signature
          in: header
          required: true
          description: "`t=<unix seconds>,v1=<hex HMAC-SHA256 of '<t>.<raw body>'>`"
          schema: { type: string }
        - name: Kalixo-Event-Id
          in: header
          required: true
          description: Same as the event `id`. Deduplicate on it.
          schema: { type: string }
        - name: Kalixo-Event-Type
          in: header
          required: true
          description: Same as the event `type`.
          schema: { $ref: "#/components/schemas/EventType" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Event" }
            examples:
              paymentCaptured: { $ref: "#/components/examples/EventPaymentCaptured" }
      responses:
        "200":
          description: Accepted.

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      description: Secret key, `kc_sk_test_...` or `kc_sk_live_...`. Server-side only.
    publishableKey:
      type: http
      scheme: bearer
      description: Publishable key, `kc_pk_test_...` or `kc_pk_live_...`. Safe for browsers.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique key per logical request, reused on retries. 1 to 255 characters, kept for
        24 hours. A retry with the same key and body returns the stored response with the
        header `Idempotent-Replayed: true`.
      schema: { type: string, minLength: 1, maxLength: 255 }
    ClientSecret:
      name: Kalixo-Client-Secret
      in: header
      required: true
      description: The checkout session's `client_secret`.
      schema: { type: string }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StartingAfter:
      name: starting_after
      in: query
      description: Cursor from a previous page's `next_cursor`.
      schema: { type: string }

  headers:
    RequestId:
      description: Unique ID of the request. Send it to Kalixo support. Matches `error.request_id`.
      schema: { type: string, examples: [req_6f1c2a9e0b7d4c3f8a1e5d2b9c0f4a7e] }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1, examples: [12] }

  responses:
    BadRequest:
      description: Invalid request (`invalid_request_error`).
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            parameter_invalid: { $ref: "#/components/examples/ErrParameterInvalid" }
    PostBadRequest:
      description: Invalid request (`invalid_request_error`).
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
