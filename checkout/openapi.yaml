      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            report_not_ready: { $ref: "#/components/examples/ErrReportNotReady" }
    ClientConflict:
      description: The checkout session no longer accepts payments.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            session_not_open: { $ref: "#/components/examples/ErrSessionNotOpen" }
            session_expired: { $ref: "#/components/examples/ErrSessionExpired" }
            payment_in_progress: { $ref: "#/components/examples/ErrPaymentInProgressClient" }
    DisputeSimulationConflict:
      description: The payment cannot be disputed in its current state.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            payment_not_disputable: { $ref: "#/components/examples/ErrPaymentNotDisputable" }
            dispute_already_open: { $ref: "#/components/examples/ErrDisputeAlreadyOpen" }
    SessionSimulationConflict:
      description: The checkout session cannot be simulated in its current state.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            session_not_open: { $ref: "#/components/examples/ErrSessionNotOpen" }
            session_expired: { $ref: "#/components/examples/ErrSessionExpired" }
            session_has_attempts: { $ref: "#/components/examples/ErrSessionHasAttempts" }
            payment_in_progress: { $ref: "#/components/examples/ErrPaymentInProgressClient" }
