          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            amount_locked: { $ref: "#/components/examples/ErrAmountLocked" }
            session_not_open: { $ref: "#/components/examples/ErrSessionNotOpen" }
    ExpireSessionConflict:
      description: The session cannot be expired now, or is no longer open.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            payment_in_progress: { $ref: "#/components/examples/ErrPaymentInProgress" }
            session_not_open: { $ref: "#/components/examples/ErrSessionNotOpen" }
            idempotency_key_reused: { $ref: "#/components/examples/ErrIdempotencyKeyReused" }
    CaptureConflict:
      description: The payment cannot be captured in its current state.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            capture_not_allowed: { $ref: "#/components/examples/ErrCaptureNotAllowed" }
            payment_not_capturable: { $ref: "#/components/examples/ErrPaymentNotCapturable" }
            payment_amount_mismatch: { $ref: "#/components/examples/ErrPaymentAmountMismatch" }
            idempotency_key_reused: { $ref: "#/components/examples/ErrIdempotencyKeyReused" }
    CancelConflict:
      description: The payment cannot be canceled in its current state.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            payment_not_cancelable: { $ref: "#/components/examples/ErrPaymentNotCancelable" }
            idempotency_key_reused: { $ref: "#/components/examples/ErrIdempotencyKeyReused" }
    RefundConflict:
      description: The payment cannot be refunded in its current state.
      headers:
