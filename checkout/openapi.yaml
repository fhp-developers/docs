      value: { payment: pay_01M75N56PRT5WA5G2JF25B20RJ, amount: 300, reason: requested_by_customer, metadata: { ticket: SUP-8812 } }
    CreateRefundFull:
      summary: Refund the rest of the captured amount
      value: { payment: pay_01M75N56PRT5WA5G2JF25B20RJ }
    CreatePaymentLink:
      summary: Single-use link for EUR 15.00
      value: { amount: 1500, currency: EUR, country: NL, reference: invoice-77, expires_at: "2026-11-30T23:59:59Z" }
    CreateCustomer:
      summary: Customer for one-click checkout
      value: { reference: user-42, email: shopper@example.com, name: Sam Shopper }
    UploadEvidence:
