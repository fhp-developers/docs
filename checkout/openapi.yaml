      description: Too many requests (`rate_limit_error`). Wait for `Retry-After` seconds, then retry with exponential backoff.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            rate_limited: { $ref: "#/components/examples/ErrRateLimited" }
    ClientTooManyRequests:
      description: Too many payment attempts (`rate_limit_error`). `too_many_attempts` is final for the session; after `rate_limited`, wait for `Retry-After` seconds.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            too_many_attempts: { $ref: "#/components/examples/ErrTooManyAttempts" }
            rate_limited: { $ref: "#/components/examples/ErrAttemptsRateLimited" }
    ServerError:
      description: Kalixo-side error (`api_error`). Retry with the same `Idempotency-Key`.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            internal_error: { $ref: "#/components/examples/ErrInternal" }
    RouteUnavailable:
      description: Kalixo cannot process this payment right now (`api_error`). Retry later.
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            payment_route_unavailable: { $ref: "#/components/examples/ErrRouteUnavailable" }

  examples:
    # Requests
    CreateSessionMinimal:
      summary: EUR 49.99, automatic capture
      description: Amounts are integers in the minor unit. `4999` is EUR 49.99.
      value:
        amount: 4999
        currency: EUR
        country: NL
        reference: order-1001
        return_url: https://shop.example.com/checkout/complete
        metadata: { cartId: abc }
    CreateSessionWithLineItems:
      summary: Line items with tax, shipping and a discount (EUR 47.99)
      description: |
        `unit_amount` includes tax. The lines add up to `amount`:
        2 x 2500 + 299 - 500 = 4799 (EUR 47.99).
      value:
        amount: 4799
        currency: EUR
        country: NL
        reference: order-1002
        return_url: https://shop.example.com/checkout/complete
        line_items:
          - { name: Gift card EUR 25, quantity: 2, unit_amount: 2500, tax_amount: 434, tax_percentage: 2100, sku: GC-EUR-25 }
          - { name: Delivery, quantity: 1, unit_amount: 299, type: shipping }
          - { name: Spring promotion, quantity: 1, unit_amount: -500, tax_amount: -87, type: discount }
    CreateSessionManualCapture:
      summary: GBP 25.00, manual capture for a stored card
      value:
        amount: 2500
        currency: GBP
        country: GB
        reference: order-2002
        return_url: https://shop.example.com/checkout/complete
        capture_method: manual
        customer: cus_01M75NC2D7E1F4G7H1J4K8M2NP
        store_payment_method: true
        expires_in: 1800
    UpdateSessionAmount:
      summary: Change the amount before the shopper pays (EUR 54.99)
      value:
        amount: 5499
        metadata: { cartId: abc, coupon: none }
    CaptureFull:
      summary: Capture the remaining authorised amount
      value: {}
    CapturePartial:
      summary: Capture EUR 6.00 of the authorisation
      value: { amount: 600 }
    CreateRefundPartial:
